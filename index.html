<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPixel — Visualização Exclusiva de Protótipo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #121212;
            --bg-card: #1c1c1e;
            --accent-gold: #bc9c6c;
            --text-main: #ffffff;
            --text-muted: #a1a1a6;
            --border-color: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* BARRA SUPERIOR DE CONCEITO */
        .top-banner {
            background-color: #1a1a1a;
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
            text-align: center;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-gold);
        }

        /* CONTAINER CENTRAL */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .showcase-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            max-width: 680px;
            width: 100%;
            border-radius: 16px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ELEMENTOS VISUAIS INTERNOS */
        .brand-pill {
            display: inline-block;
            background: rgba(188, 156, 108, 0.1);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1.client-name {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .client-type {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 30px 0;
        }

        /* TEXTO DA PROPOSTA */
        .pitch-text {
            color: #e5e5ea;
            font-size: 15px;
            line-height: 1.8;
            text-align: justify;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* SECÇÃO DE FUNCIONALIDADES EXCLUSIVAS (GRID) */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            text-align: left;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 8px;
        }

        .feature-item title {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .feature-item desc {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* BOTÃO INTERATIVO CALL-TO-ACTION */
        .cta-button {
            display: inline-block;
            background: var(--text-main);
            color: var(--bg-primary);
            text-decoration: none;
            padding: 18px 40px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .cta-button:hover {
            background: var(--accent-gold);
            color: var(--text-main);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(188, 156, 108, 0.3);
        }

        /* MÓDULO DE MAPA INTEGRADO */
        .map-section {
            margin-top: 40px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #222;
            height: 250px;
        }

        /* INFORMAÇÕES DE SUPORTE */
        .meta-info-container {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 20px;
            border-radius: 6px;
        }

        /* BOTTOM NAVIGATION BAR (IDÊNTICO AO LOOK DA FOTO) */
        .bottom-nav {
            background-color: #0d0d0d;
            border-top: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .bottom-nav-inner {
            max-width: 400px;
            margin: 0 auto;
            background: #1c1c1e;
            padding: 6px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            border: 1px solid #2c2c2e;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 10px 22px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .nav-item.active {
            background: #2c2c2e;
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .showcase-card { padding: 30px 20px; }
            h1.client-name { font-size: 32px; }
            .features-grid { grid-template-columns: 1fr; }
            .meta-info-container { flex-direction: column; gap: 8px; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="top-banner" class="top-banner">CONCEITO EXCLUSIVO DIGITAL</div>

    <div class="main-wrapper">
        <div class="showcase-card">
            <span class="brand-pill">Estudo de Caso Ativo</span>
            <h1 id="client-title" class="client-name">A carregar...</h1>
            <div id="client-subtitle" class="client-type">Análise de Ecossistema</div>
            
            <p id="client-pitch" class="pitch-text">
                O nosso motor algorítmico está a estruturar o layout de demonstração interativo...
            </p>

            <div class="features-grid" id="features-box">
                </div>

            <a id="action-btn" href="#" class="cta-button">Iniciar Ligação Segura</a>

            <div id="map-wrapper" class="map-section"></div>

            <div class="meta-info-container">
                <span id="meta-location">📍 Localização: Não fornecida</span>
                <span id="meta-phone">📞 Linha Direta: Geral</span>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="#" class="nav-item active">Início</a>
            <a href="#" class="nav-item">Serviços</a>
            <a href="#" class="nav-item">Reservar</a>
        </div>
    </div>

    <script>
        // Capturar os dados injetados via Query Parameters pelo maquina.py
        const urlParams = new URLSearchParams(window.location.search);
        const nomeNegocio = urlParams.get('nome') || 'O Vosso Espaço';
        const tipoNegocio = (urlParams.get('tipo') || 'restaurante').toLowerCase().trim();
        const telefone = urlParams.get('tel') || '';
        const localizacao = urlParams.get('loc') || '';

        // Atualização dos elementos fixos e metadados estruturais
        document.getElementById('client-title').innerText = nomeNegocio;
        document.getElementById('top-banner').innerText = `CONCEITO EXCLUSIVO: ${nomeNegocio.toUpperCase()}`;
        if (localizacao) document.getElementById('meta-location').innerText = `📍 ${localizacao}`;
        if (telefone) document.getElementById('meta-phone').innerText = `📞 ${telefone}`;

        // Matriz de dados rica por Especialidade (Copywriting e Módulos Avançados)
        const baseConceitos = {
            barbearia: {
                subtitulo: "Estética Masculina & Visagismo de Elite",
                pitch: `Desenhámos para a ${nomeNegocio} um ecossistema focado na otimização da jornada do cliente moderno. O protótipo resolve falhas críticas de retenção de clientes através de agendamentos automatizados em 3 cliques, gestão de tempos mortos na cadeira e uma montra digital que valoriza rituais de barba clássicos com toalha quente e cortes cirúrgicos de assinatura.`,
                cta: "Testar Agendamento em Tempo Real",
                features: [
                    { t: "Agendamento Inteligente", d: "Sincronização imediata com os profissionais disponíveis de forma visual." },
                    { t: "Lembretes Automáticos SMS", d: "Redução de faltas em até 87% através de confirmações dinâmicas." },
                    { t: "Portfólio de Alta Resolução", d: "Galeria integrada para exibição de cortes e avaliações de clientes." },
                    { t: "Painel de Faturação", d: "Métricas detalhadas sobre o ticket médio e os serviços mais rentáveis." }
                ]
            },
            restaurante: {
                subtitulo: "Alta Gastronomia de Autor & Experiência Sensorial",
                pitch: `A arquitetura digital proposta para a ${nomeNegocio} foi estruturada para transitar menus tradicionais para uma experiência interativa premium. Minimizámos o atrito nas reservas digitais, integrámos um sistema de pedidos intuitivo focado em menus de degustação e construímos uma narrativa visual sofisticada para evidenciar a frescura dos vossos ingredientes e a excelência da vossa garrafeira.`,
                cta: "Explorar Menu Executivo & Reservas",
                features: [
                    { t: "Gestão Dinâmica de Mesas", d: "Otimização de lugares por turnos com atualização em live feed." },
                    { t: "Menu QR Code Interativo", d: "Alterações de preços e pratos do dia em menos de 10 segundos." },
                    { t: "Módulo de Eventos", d: "Captação automatizada de propostas para jantares de grupo e corporate." },
                    { t: "Reviews Filtradas", d: "Exibição orgânica das melhores notas do TripAdvisor e Google." }
                ]
            },
            cafe: {
                subtitulo: "Café de Especialidade, Brunch & Espaço Coworking",
                pitch: `Para a equipa da ${nomeNegocio}, idealizámos um conceito focado na cultura urbana e de conveniência. O protótipo foca-se na fidelização através de cartões de consumo digitais, gestão fluida de pedidos para take-away no horário de pico e promoção da vossa atmosfera diferenciada, ideal quer para brunches tardios ao fim de semana, quer para profissionais em regime de trabalho remoto.`,
                cta: "Visualizar Menu de Especialidades",
                features: [
                    { t: "Fidelização Nativa (Loyalty)", d: "Sistema de pontos integrado para clientes frequentes sem usar cartões de papel." },
                    { t: "Take-Away Express", d: "Permite ao cliente ordenar e pagar antes mesmo de entrar no estabelecimento." },
                    { t: "Estatísticas de Pico", d: "Análise inteligente de tráfego para ajustar equipas de atendimento." },
                    { t: "Galeria de Ambiente", d: "Destaque visual do espaço para reserva de workshops e eventos privados." }
                ]
            }
        };

        // Seleção do conceito ou fallback seguro para restaurante
        const contextoAtivo = baseConceitos[tipoNegocio] || baseConceitos['restaurante'];

        // Injeção dinâmica dos dados de copywriting e interface
        document.getElementById('client-subtitle').innerText = contextoAtivo.subtitulo;
        document.getElementById('client-pitch').innerText = contextoAtivo.pitch;
        
        const btnAcao = document.getElementById('action-btn');
        btnAcao.innerText = contextoAtivo.cta;
        if (telefone) {
            btnAcao.href = `tel:${telefone}`;
        }

        // Construção da grelha de funcionalidades
        const boxFeatures = document.getElementById('features-box');
        boxFeatures.innerHTML = contextoAtivo.features.map(f => `
            <div class="feature-item">
                <title>${f.t}</title>
                <desc>${f.d}</desc>
            </div>
        `).join('');

        // Geração Orgânica do Mapa Google Maps Iframe com base na Localização do CSV
        const wrapperMapa = document.getElementById('map-wrapper');
        if (localizacao) {
            const endpointMapa = `https://maps.google.com/maps?q=${encodeURIComponent(localizacao)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            wrapperMapa.innerHTML = `<iframe width="100%" height="100%" style="border:0; filter: grayscale(1) invert(1) contrast(1.2);" src="${endpointMapa}" allowfullscreen loading="lazy"></iframe>`;
        } else {
            wrapperMapa.style.display = 'none';
        }
    </script>
</body>
</html>
