<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Protótipo Exclusivo - NovaPixel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            min-height: 100vh;
            color: #ffffff;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            padding-bottom: 90px; /* Espaço para o menu inferior */
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            position: relative; z-index: 10;
            padding: 20px; text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
        }
        .demo-badge {
            display: inline-block;
            font-size: 9px; font-weight: 600; letter-spacing: 2px;
            padding: 6px 12px; border-radius: 20px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase;
        }

        /* CONTEÚDO PRINCIPAL */
        main {
            position: relative; z-index: 5;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; min-height: 75vh;
        }

        .screen {
            display: none; width: 100%; max-width: 500px;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .screen.active { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ESTRUTURA DO CARTÃO VIDRO (Glassmorphism) */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        h1.title { font-family: 'Playfair Display', serif; font-size: 36px; line-height: 1.1; margin-bottom: 10px; }
        p.subtitle { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.7; margin-bottom: 40px; }

        /* LISTA EDITORIAL (Menus) */
        .menu-list { text-align: left; margin-bottom: 30px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-item:last-child { border-bottom: none; }
        .item-details h3 { font-size: 15px; font-weight: 500; }
        .item-details p { font-size: 11px; opacity: 0.6; margin-top: 4px; }
        .item-price { font-weight: 600; color: var(--accent); font-size: 16px; }

        /* MAPA */
        .map-container { width: 100%; height: 300px; border-radius: 16px; overflow: hidden; margin-top: 20px; }
        .map-container iframe { width: 100%; height: 100%; border: none; }

        /* BOTÃO PRINCIPAL */
        .btn-action {
            display: inline-block; width: 100%;
            background: var(--accent); color: var(--btn-text);
            padding: 18px; border-radius: 16px; text-decoration: none;
            font-size: 14px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
            border: none; cursor: pointer; transition: 0.3s;
        }
        .btn-action:hover { transform: scale(0.98); opacity: 0.9; }

        /* MENU DE NAVEGAÇÃO INFERIOR (Estilo App) */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 50;
            background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            display: flex; justify-content: space-between; padding: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .nav-btn {
            flex: 1; text-align: center; padding: 12px 0; color: rgba(255,255,255,0.5);
            font-size: 11px; font-weight: 500; letter-spacing: 1px; cursor: pointer;
            border-radius: 20px; transition: 0.3s; text-transform: uppercase;
        }
        .nav-btn.active { background: rgba(255,255,255,0.1); color: var(--accent); }

        /* TEMAS */
        body.theme-barbearia {
            background-image: url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=1200');
            --accent: #d4af37; --btn-text: #000;
        }
        body.theme-restaurante {
            background-image: url('https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?q=80&w=1200');
            --accent: #e2a87a; --btn-text: #000;
        }
        body.theme-cafe {
            background-image: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=1200');
            --accent: #b18f6a; --btn-text: #fff;
        }
    </style>
</head>
<body class="theme-restaurante" id="body-render">

    <div class="overlay"></div>

    <div class="top-bar">
        <div class="demo-badge" id="badge-nome">Demonstração</div>
    </div>

    <main>
        <div class="screen active" id="tab-home">
            <div class="glass-card">
                <h1 class="title" id="lbl-nome">A Carregar...</h1>
                <p class="subtitle" id="lbl-sub">Conceito Digital</p>
                <button class="btn-action" onclick="mudarSeparador('tab-menu')">Ver Serviços e Preços</button>
                <div style="margin-top: 20px; font-size: 10px; opacity: 0.4;">ESTRUTURA DESENVOLVIDA POR NOVAPIXEL</div>
            </div>
        </div>

        <div class="screen" id="tab-menu">
            <div class="glass-card">
                <h1 class="title" style="font-size: 28px;">O Nosso Menu</h1>
                <p class="subtitle" style="margin-bottom: 20px;">Catálogo Demonstrativo</p>
                
                <div class="menu-list" id="box-itens">
                    </div>

                <a class="btn-action" id="link-whatsapp" target="_blank" style="margin-top: 10px;">Efetuar Reserva / Contacto</a>
            </div>
        </div>

        <div class="screen" id="tab-local">
            <div class="glass-card">
                <h1 class="title" style="font-size: 28px;">Localização</h1>
                <p class="subtitle" id="lbl-morada-texto" style="margin-bottom: 10px; text-transform: none; letter-spacing: 1px;">A carregar mapa...</p>
                
                <div class="map-container" id="box-mapa"></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-btn active" id="btn-tab-home" onclick="mudarSeparador('tab-home')">Início</div>
        <div class="nav-btn" id="btn-tab-menu" onclick="mudarSeparador('tab-menu')">Menu</div>
        <div class="nav-btn" id="btn-tab-local" onclick="mudarSeparador('tab-local')">Onde Estamos</div>
    </nav>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const nomeEmpresa = parametros.get('n') || "O Vosso Espaço";
        const tokenOculto = parametros.get('v');

        let tipoNegocio = "restaurante";
        let telefoneNumero = "351900000000";
        let moradaFisica = "Portugal";

        if (tokenOculto) {
            try {
                const textoDescodificado = atob(decodeURIComponent(tokenOculto));
                const partes = textoDescodificado.split('|');
                if (partes.length >= 4) {
                    tipoNegocio = partes[0];
                    telefoneNumero = partes[1];
                    moradaFisica = partes[3];
                }
            } catch (e) { console.error("Erro."); }
        }

        document.getElementById('lbl-nome').innerText = nomeEmpresa;
        document.getElementById('badge-nome').innerText = `${nomeEmpresa.toUpperCase()} - TESTE`;
        document.getElementById('lbl-morada-texto').innerText = moradaFisica;

        const bodyAlvo = document.getElementById('body-render');
        const subRotulo = document.getElementById('lbl-sub');
        const contentorItens = document.getElementById('box-itens');

        if (tipoNegocio === 'barbearia') {
            bodyAlvo.className = "theme-barbearia";
            subRotulo.innerText = "Excelência em Grooming";
            contentorItens.innerHTML = `
                <div class="menu-item"><div class="item-details"><h3>Corte Premium</h3><p>Tesoura e máquina com finalização</p></div><div class="item-price">18€</div></div>
                <div class="menu-item"><div class="item-details"><h3>Barba Terapia</h3><p>Toalha quente e óleos essenciais</p></div><div class="item-price">14€</div></div>
                <div class="menu-item"><div class="item-details"><h3>Pack Completo</h3><p>Cabelo e Barba com tratamento</p></div><div class="item-price">28€</div></div>
            `;
        } else if (tipoNegocio === 'cafe') {
            bodyAlvo.className = "theme-cafe";
            subRotulo.innerText = "Cafetaria Especializada";
            contentorItens.innerHTML = `
                <div class="menu-item"><div class="item-details"><h3>Café de Origem</h3><p>Moído na hora (Arábica 100%)</p></div><div class="item-price">1.50€</div></div>
                <div class="menu-item"><div class="item-details"><h3>Croissant Francês</h3><p>Artesanal, manteiga extra</p></div><div class="item-price">2.20€</div></div>
                <div class="menu-item"><div class="item-details"><h3>Brunch NovaPixel</h3><p>Sumo, panquecas, ovos e café</p></div><div class="item-price">14.00€</div></div>
            `;
        } else {
            bodyAlvo.className = "theme-restaurante";
            subRotulo.innerText = "Gastronomia de Assinatura";
            contentorItens.innerHTML = `
                <div class="menu-item"><div class="item-details"><h3>Menu Executivo</h3><p>Entrada, Prato do Chef e Bebida</p></div><div class="item-price">16.50€</div></div>
                <div class="menu-item"><div class="item-details"><h3>Especialidade Sazonal</h3><p>Ingredientes locais selecionados</p></div><div class="item-price">22.00€</div></div>
                <div class="menu-item"><div class="item-details"><h3>Sobremesa D'Autor</h3><p>Criação exclusiva do nosso pasteleiro</p></div><div class="item-price">6.50€</div></div>
            `;
        }

        document.getElementById('link-whatsapp').href = `https://wa.me/351${telefoneNumero}?text=Olá!%20Acedi%20ao%20vosso%20protótipo%20digital%20da%20NovaPixel%20e%20gostaria%20de%20esclarecer%20detalhes%20sobre%20os%20serviços%20da%20${encodeURIComponent(nomeEmpresa)}.`;
        document.getElementById('box-mapa').innerHTML = `<iframe src="http://googleusercontent.com/maps.google.com/4{encodeURIComponent(moradaFisica)}&t=&z=15&ie=UTF-8&iwloc=&output=embed"></iframe>`;

        function mudarSeparador(idTab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(idTab).classList.add('active');
            document.getElementById(`btn-${idTab}`).classList.add('active');
        }
    </script>
</body>
</html>
