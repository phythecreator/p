<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPixel — Visualização de Protótipo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #121212;
            --bg-card: #1c1c1e;
            --accent-color: #bc9c6c; /* Cor dinâmica */
            --text-main: #ffffff;
            --text-muted: #a1a1a6;
            --border-color: #2c2c2e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-banner {
            background-color: #1a1a1a;
            border-bottom: 1px solid var(--border-color);
            padding: 14px;
            text-align: center;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .showcase-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            max-width: 650px;
            width: 100%;
            border-radius: 16px;
            padding: 45px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-pill {
            display: inline-block;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1.client-name {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .client-type {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .pitch-text {
            color: #e5e5ea;
            font-size: 15px;
            line-height: 1.8;
            text-align: justify;
            margin-bottom: 30px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 35px;
            text-align: left;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
        }

        .feature-item title {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .feature-item desc {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .cta-button {
            display: inline-block;
            background: var(--text-main);
            color: var(--bg-primary);
            text-decoration: none;
            padding: 18px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .cta-button:hover {
            background: var(--accent-color);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .map-section {
            margin-top: 35px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            height: 220px;
        }

        .meta-info-container {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.15);
            padding: 12px 20px;
            border-radius: 6px;
        }

        .bottom-nav {
            background-color: #0d0d0d;
            border-top: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .bottom-nav-inner {
            max-width: 400px;
            margin: 0 auto;
            background: #1c1c1e;
            padding: 6px;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            border: 1px solid #2c2c2e;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 20px;
        }

        .nav-item.active {
            background: #2c2c2e;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div id="top-banner" class="top-banner">PROTÓTIPO EXCLUSIVO</div>

    <div class="main-wrapper">
        <div class="showcase-card">
            <span class="brand-pill" id="badge-tipo">STUDIO DIGITAL</span>
            <h1 id="client-title" class="client-name">Carregando...</h1>
            <div id="client-subtitle" class="client-type">Por favor, aguarde...</div>
            
            <p id="client-pitch" class="pitch-text"></p>

            <div class="features-grid" id="features-box"></div>

            <a id="action-btn" href="#" class="cta-button">Contactar Agência</a>

            <div id="map-wrapper" class="map-section"></div>

            <div class="meta-info-container">
                <span id="meta-location">📍 Localização</span>
                <span id="meta-phone">📞 Telefone</span>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="#" class="nav-item active">Início</a>
            <a href="#" class="nav-item">Serviços</a>
            <a href="#" class="nav-item">Reservas</a>
        </div>
    </div>

    <script>
        // Capturar os dados passados pelo Python de forma limpa
        const urlParams = new URLSearchParams(window.location.search);
        const nome = urlParams.get('nome') || 'O Vosso Espaço';
        const tipo = (urlParams.get('tipo') || 'restaurante').toLowerCase().trim();
        const tel = urlParams.get('tel') || '';
        const loc = urlParams.get('loc') || '';

        // Atualizar os textos base da página
        document.getElementById('client-title').innerText = nome;
        document.getElementById('meta-location').innerText = loc ? `📍 ${loc}` : '📍 Localização sob consulta';
        document.getElementById('meta-phone').innerText = tel ? `📞 ${tel}` : '📞 Linha Geral';

        // Definição Inteligente de TEMAS (Cores e Textos Dedicados)
        const configuradorTemas = {
            barbearia: {
                cor: "#d4af37", // Dourado Barbearia Clássica
                subtitulo: "Estética Masculina & Visagismo Moderno",
                badge: "Conceito Barbearia Premium",
                pitch: `Desenhámos para a ${nome} uma plataforma focada na retenção e conversão de clientes. O protótipo otimiza a vossa agenda através de marcações em 3 cliques, reduzindo tempos mortos nas cadeiras e promovendo rituais exclusivos de corte e barba.`,
                cta: "Testar Agenda de Cortes",
                features: [
                    { t: "Cadeiras Otimizadas", d: "Sincronização de horários por barbeiro em tempo real." },
                    { t: "Alertas SMS Automáticos", d: "Redução drástica de faltas e esquecimentos por parte dos clientes." }
                ]
            },
            restaurante: {
                cor: "#bc9c6c", // Bronze Sofisticado Restaurante
                subtitulo: "Alta Gastronomia & Gestão de Reservas Eficiente",
                badge: "Conceito Fine Dining",
                pitch: `A arquitetura digital proposta para a ${nome} moderniza a gestão de turnos e mesas. Eliminamos o atrito telefónico, permitindo aos clientes reservar mesas e explorar o vosso menu digital sofisticado instantaneamente.`,
                cta: "Simular Reserva de Mesa",
                features: [
                    { t: "Gestão de Turnos", d: "Controlo absoluto sobre a ocupação de mesas por horários." },
                    { t: "Menu QR Code Dinâmico", d: "Alterações de pratos e preços de forma instantânea e autónoma." }
                ]
            },
            cafe: {
                cor: "#e0a96d", // Castanho Café Acolhedor
                subtitulo: "Brunch, Cafés de Especialidade & Cultura",
                badge: "Conceito Cozy Coffee",
                pitch: `Para a equipa da ${nome}, idealizámos um hub digital que valoriza o vosso espaço e ambiente. Integra ferramentas de take-away expresso e cartões de fidelização virtuais para cativar clientes habituais.`,
                cta: "Visualizar Menu Take-Away",
                features: [
                    { t: "Fidelização Nativa", d: "Cartão de pontos digital automático para os amantes de café." },
                    { t: "Order & Collect", d: "Permite pedir antes de chegar para evitar filas nos picos da manhã." }
                ]
            }
        };

        // Carregar o tema selecionado (ou usar restaurante como segurança)
        const tema = configuradorTemas[tipo] || configuradorTemas['restaurante'];

        // APLICAR AS CORES DO TEMA DINAMICAMENTE (Customização de verdade!)
        document.documentElement.style.setProperty('--accent-color', tema.cor);
        document.getElementById('badge-tipo').innerText = tema.badge;
        document.getElementById('client-subtitle').innerText = tema.subtitulo;
        document.getElementById('client-pitch').innerText = tema.pitch;
        
        const btn = document.getElementById('action-btn');
        btn.innerText = tema.cta;
        if(tel) btn.href = `tel:${tel}`;

        // Injetar características do tema
        document.getElementById('features-box').innerHTML = tema.features.map(f => `
            <div class="feature-item">
                <title>${f.t}</title>
                <desc>${f.d}</desc>
            </div>
        `).join('');

        // GERAR O MAPA GOOGLE CORRETAMENTE USANDO TEMPLATE LITERALS SÉRIO (${})
        const wrapperMapa = document.getElementById('map-wrapper');
        if (loc) {
            const linkMapaSeguro = `https://maps.google.com/maps?q=${encodeURIComponent(loc)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            wrapperMapa.innerHTML = `<iframe width="100%" height="100%" style="border:0; filter: grayscale(1) invert(1) contrast(1.2);" src="${linkMapaSeguro}" allowfullscreen loading="lazy"></iframe>`;
        } else {
            wrapperMapa.style.display = 'none';
        }
    </script>
</body>
</html>
